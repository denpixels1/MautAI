<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212121"><title>Maut AI</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"><a class="brand" href="/"><span class="brand-icon">✳</span><span>Maut AI</span></a><button class="new-chat" id="newChat">＋ <span>Новый чат</span></button><div class="history-label">Недавние</div><div id="history" class="history"><p class="muted small">Твои чаты появятся здесь</p></div><div class="side-bottom"><button class="side-action" id="imageMode">▧ <span>Создать изображение</span></button><div class="profile"><div class="avatar" id="avatar">G</div><div class="profile-info"><strong id="profileName">Гость</strong><span id="profileEmail">Войди, чтобы начать</span></div><button class="dots" id="profileMenu" title="Аккаунт">···</button></div></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="menuBtn" aria-label="Меню">☰</button><div class="model-label">Maut AI <span>⌄</span></div><div class="top-right"><button class="login-button" id="loginBtn">Войти</button></div></header><section class="chat-area"><div class="welcome" id="welcome"><div class="welcome-icon">✳</div><h1>С чего начнём?</h1><p>Спроси о чём угодно или придумай что-то новое.</p><div class="suggestions"><button data-prompt="Объясни сложную тему простыми словами" class="suggestion"><span>◉</span><b>Объясни тему</b><small>Разобраться в сложном</small></button><button data-prompt="Помоги придумать интересную игру" class="suggestion"><span>⌘</span><b>Придумай идею</b><small>Игры, проекты и творчество</small></button><button data-prompt="Напиши короткую захватывающую историю" class="suggestion"><span>✎</span><b>Напиши текст</b><small>Истории и сообщения</small></button><button data-image="1" class="suggestion"><span>▧</span><b>Создай изображение</b><small>Воплоти идею в картинку</small></button></div></div><div class="messages" id="messages" aria-live="polite"></div></section><footer class="composer-wrap"><div id="status" class="status" role="status"></div><form class="composer" id="chatForm"><textarea id="prompt" rows="1" maxlength="12000" placeholder="Напиши Maut AI" aria-label="Сообщение"></textarea><div class="composer-bottom"><div class="composer-actions"><button type="button" class="tool" id="imageBtn">＋ <span>Создать изображение</span></button><span class="hint">Enter — отправить · Shift+Enter — новая строка</span></div><button class="send" id="sendBtn" type="submit" aria-label="Отправить">↑</button></div></form><p class="fine-print">Maut AI может ошибаться. Проверяй важную информацию.</p></footer></main></div>
<div class="modal-layer" id="authModal" aria-hidden="true"><section class="modal"><button class="modal-x" id="closeModal" aria-label="Закрыть">×</button><div class="modal-brand">✳</div><h2 id="modalTitle">Войти в Maut AI</h2><p id="modalSubtitle">Продолжи общение с ИИ.</p><form id="authForm"><label id="nameLabel" class="hidden">Имя<input id="name" autocomplete="name" maxlength="40" placeholder="Твоё имя"></label><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Пароль<input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="Не менее 8 символов"></label><p class="form-error" id="authError"></p><button class="primary" id="authSubmit" type="submit">Войти</button></form><button class="switch-auth" id="switchAuth">Нет аккаунта? Зарегистрироваться</button></section></div><script src="/app.js" defer></script></body></html>
