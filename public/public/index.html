
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>Maut AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#212121;--side:#171717;--panel:#2f2f2f;--panel-hover:#383838;--line:#383838;--text:#ececec;--muted:#a0a0a0;--green:#10a37f}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.layout{display:flex;width:100%;height:100dvh;min-height:0;overflow:hidden}
.sidebar{width:260px;flex:0 0 260px;background:var(--side);padding:12px;display:flex;flex-direction:column;height:100%;min-height:0;overflow-y:auto}
.brand{height:46px;display:flex;align-items:center;gap:10px;padding:0 9px;text-decoration:none;color:var(--text);font-weight:650;font-size:17px}
.brand-icon{font-size:25px;color:#f1f1f1}
.new-chat{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #414141;background:transparent;border-radius:9px;padding:11px 12px;margin:12px 0 24px}
.new-chat:hover,.side-action:hover{background:#242424}
.history-label{font-size:12px;color:#aaa;padding:0 10px 8px}
.history{overflow:auto;min-height:0}
.history-item{display:block;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:8px;text-align:left;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:13px}
.history-item:hover,.history-item.active{background:#292929}
.muted{color:var(--muted)}
.small{font-size:12px;padding:0 10px}
.side-bottom{margin-top:auto}
.side-action{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;text-align:left;padding:11px 10px}
.profile{display:flex;align-items:center;gap:9px;border-top:1px solid #303030;margin-top:12px;padding:14px 3px 3px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#6559a6;font-weight:650;flex-shrink:0}
.profile-info{flex:1;min-width:0}
.profile-info strong,.profile-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-info strong{font-size:13px;font-weight:600}
.profile-info span{font-size:11px;color:var(--muted)}
.dots{border:0;background:transparent;font-size:20px}
.main{min-width:0;flex:1;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;flex:0 0 60px;display:flex;align-items:center;padding:0 25px;gap:12px}
.model-label{font-size:16px;font-weight:600}
.model-label span{color:#999;margin-left:4px}
.top-right{margin-left:auto}
.login-button{background:transparent;border:1px solid #555;border-radius:20px;padding:7px 15px;font-size:13px}
.login-button:hover{background:#333}
.mobile-menu{display:none;background:transparent;border:0;font-size:20px}
.chat-area{width:min(790px,100%);padding:30px 24px 20px;margin:0 auto;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.welcome{margin:auto 0;text-align:center;padding:25px 0 40px}
.welcome-icon{font-size:31px;line-height:1;margin-bottom:18px;color:#eee}
.welcome h1{font-size:clamp(27px,4vw,34px);font-weight:600;letter-spacing:-.8px;margin:0 0 10px}
.welcome p{margin:0;color:#aaa;font-size:15px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:580px;margin:28px auto 0;text-align:left}
.suggestion{min-height:84px;position:relative;display:grid;grid-template-columns:24px 1fr;grid-template-rows:auto auto;align-content:center;column-gap:9px;text-align:left;padding:15px;border:1px solid #454545;background:transparent;border-radius:13px}
.suggestion:hover{background:#2b2b2b}
.suggestion>span{grid-row:1/3;font-size:18px;color:#c2c2c2}
.suggestion b{font-size:13px;font-weight:550}
.suggestion small{font-size:12px;color:#999;margin-top:3px}
.composer-wrap{width:min(790px,100%);flex:0 0 auto;position:relative;z-index:5;padding:0 24px max(18px,env(safe-area-inset-bottom));margin:0 auto;background:var(--bg)}
.composer{background:#2f2f2f;border:1px solid #484848;border-radius:25px;padding:12px 13px 10px;box-shadow:0 5px 20px #00000012}
.composer:focus-within{border-color:#666}
.composer textarea{display:block;width:100%;resize:none;max-height:180px;min-height:31px;outline:0;border:0;background:transparent;color:var(--text);padding:4px 4px 12px}
.composer textarea::placeholder{color:#aaa}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.composer-actions{display:flex;align-items:center;gap:10px;min-width:0}
.tool{border:1px solid #555;background:transparent;border-radius:18px;padding:6px 11px;font-size:12px;color:#ddd}
.tool:hover{background:#404040}
.hint{font-size:10px;color:#858585}
.send{width:34px;height:34px;border:0;border-radius:50%;background:#eee;color:#202020;font-size:22px;line-height:1;flex-shrink:0}
.send:disabled{opacity:.45;cursor:wait}
.fine-print{text-align:center;color:#858585;font-size:11px;margin:9px 0 0}
.messages{display:flex;flex-direction:column;gap:25px;min-width:0}
.message{display:flex;gap:12px;align-items:flex-start;min-width:0}
.message.user{justify-content:flex-end}
.bubble{max-width:88%;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.7}
.message.user .bubble{background:#303030;border-radius:20px;padding:10px 15px;max-width:80%}
.message.assistant .bubble{padding:2px 0;flex:1;max-width:100%;white-space:normal;line-height:1.75}
.message-mark{width:28px;height:28px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#ececec;color:#222;font-size:17px}
.message-image{display:block;max-width:min(100%,520px);border-radius:12px;margin-top:12px}
.download-link{display:inline-block;margin-top:8px;color:#b7d9ff}
.status{display:none;margin:0 auto 10px;width:100%;font-size:13px;color:#d7d7d7}
.status.show{display:block}
.status.error{color:#ffaaa7}
.modal-layer{position:fixed;inset:0;z-index:20;background:#0009;display:none;place-items:center;padding:20px}
.modal-layer.open{display:grid}
.modal{position:relative;width:min(410px,100%);max-height:90dvh;overflow:auto;background:#242424;border:1px solid #454545;border-radius:20px;padding:28px;box-shadow:0 20px 80px #0007}
.modal-x{position:absolute;right:14px;top:12px;background:transparent;border:0;font-size:24px;color:#aaa}
.modal-brand{text-align:center;font-size:27px;margin:0 0 10px}
.modal h2{text-align:center;margin:0 0 6px;font-size:22px}
.modal>p{text-align:center;color:#aaa;font-size:13px;margin:0 0 22px}
.modal label{display:block;font-size:12px;color:#ccc;margin:12px 0}
.modal input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #4b4b4b;background:#171717;color:white;border-radius:9px;outline:0}
.modal input:focus{border-color:#999}
.primary{width:100%;border:0;background:#eee;color:#222;border-radius:20px;padding:10px;font-weight:600;margin-top:8px}
.switch-auth{display:block;margin:15px auto 0;border:0;background:transparent;color:#ccc;font-size:12px}
.form-error{color:#ff9c97;font-size:12px;margin:5px 0}
.hidden{display:none!important}

/* Markdown styling */
.message.assistant .bubble h1,.message.assistant .bubble h2,.message.assistant .bubble h3,.message.assistant .bubble h4{color:var(--text);line-height:1.35;margin:24px 0 12px;font-weight:650}
.message.assistant .bubble h1{font-size:26px}
.message.assistant .bubble h2{font-size:22px}
.message.assistant .bubble h3{font-size:18px}
.message.assistant .bubble p{margin:0 0 14px}
.message.assistant .bubble p:last-child{margin-bottom:0}
.message.assistant .bubble ul,.message.assistant .bubble ol{padding-left:26px;margin:10px 0 18px}
.message.assistant .bubble li{padding-left:4px;margin:5px 0}
.message.assistant .bubble strong{font-weight:700;color:#fff}
.message.assistant .bubble a{color:#9ecbff;text-decoration:underline;text-underline-offset:3px}
.message.assistant .bubble blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid #777;background:#292929;color:#ccc;border-radius:0 8px 8px 0}
.message.assistant .bubble pre{max-width:100%;overflow-x:auto;padding:16px;margin:14px 0;border:1px solid #404040;border-radius:12px;background:#171717;line-height:1.6}
.message.assistant .bubble pre code{padding:0;background:transparent;white-space:pre}
.message.assistant .bubble :not(pre)>code{padding:2px 6px;border-radius:5px;background:#373737;font-family:Consolas,Monaco,monospace;font-size:.9em}
.message.assistant .bubble table{display:block;width:100%;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:16px 0}
.message.assistant .bubble th,.message.assistant .bubble td{border:1px solid #454545;padding:9px 12px;text-align:left}
.message.assistant .bubble th{background:#303030;font-weight:650}
.message.assistant .bubble tr:nth-child(even){background:#292929}
.message.assistant .bubble hr{border:0;border-top:1px solid #414141;margin:22px 0}
.message.assistant .bubble img{max-width:100%;height:auto;border-radius:10px}
.message.assistant .bubble pre code{display:block}

@media(max-width:760px){
.sidebar{position:fixed;z-index:15;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s;box-shadow:15px 0 50px #0006}
.sidebar.open{transform:translateX(0)}
.mobile-menu{display:block}
.topbar{padding:0 15px}
.chat-area{padding:20px 15px}
.composer-wrap{padding:8px 10px max(12px,env(safe-area-inset-bottom))}
.suggestions{grid-template-columns:1fr;max-width:440px}
.welcome{padding:15px 0 25px}
.welcome h1{font-size:28px}
.hint{display:none}
.tool span{display:none}
.composer{border-radius:21px}
.modal{padding:24px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" id="brandHome"><span class="brand-icon">✳</span><span>Maut AI</span></a>
    <button class="new-chat" id="newChat"><span>＋</span> Новый чат</button>
    <div class="history-label">История</div>
    <div class="history" id="history"><div class="small muted">Войди, чтобы сохранять чаты</div></div>
    <div class="side-bottom">
      <button class="side-action" id="authSide">♙ <span>Войти в аккаунт</span></button>
      <div class="profile hidden" id="profile"><div class="avatar" id="avatar">M</div><div class="profile-info"><strong id="profileName">Пользователь</strong><span id="profileEmail">Аккаунт</span></div><button class="dots" id="logout" title="Выйти">⋯</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="Открыть меню">☰</button><div class="model-label">Maut AI <span>▾</span></div><div class="top-right"><button class="login-button" id="loginTop">Войти</button></div></header>
    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome"><div class="welcome-icon">✳</div><h1>Чем могу помочь?</h1><p>Спроси что угодно — начнём.</p><div class="suggestions"><button class="suggestion" data-prompt="Объясни сложную тему простыми словами"><span>✧</span><b>Объяснить тему</b><small>Просто и понятно</small></button><button class="suggestion" data-prompt="Напиши пример кода и объясни, как он работает"><span>⌘</span><b>Написать код</b><small>С примерами и пояснениями</small></button><button class="suggestion" data-prompt="Помоги придумать идею для проекта"><span>✎</span><b>Придумать идею</b><small>Для нового проекта</small></button><button class="suggestion" data-prompt="Составь пошаговый план обучения программированию"><span>↗</span><b>Составить план</b><small>Шаг за шагом</small></button></div></div>
      <div class="messages" id="messages"></div>
    </section>
    <div class="composer-wrap"><div class="status" id="status"></div><form class="composer" id="composer"><textarea id="prompt" rows="1" maxlength="30000" placeholder="Напиши сообщение Maut AI..." aria-label="Сообщение"></textarea><div class="composer-bottom"><div class="composer-actions"><button class="tool" type="button" id="imageMode">✧ <span>Создать изображение</span></button><span class="hint">Enter — отправить · Shift+Enter — новая строка</span></div><button class="send" id="send" type="submit" aria-label="Отправить">↑</button></div></form><div class="fine-print">Maut AI может допускать ошибки. Проверяй важную информацию.</div></div>
  </main>
</div>
<div class="modal-layer" id="authModal"><form class="modal" id="authForm"><button class="modal-x" type="button" id="closeModal" aria-label="Закрыть">×</button><div class="modal-brand">✳</div><h2 id="authTitle">Войти в Maut AI</h2><p id="authSubtitle">Рады видеть тебя снова.</p><div id="nameField" class="hidden"><label>Имя<input id="authName" autocomplete="name" maxlength="60"></label></div><label>Email<input id="authEmail" type="email" autocomplete="email" required maxlength="254"></label><label>Пароль<input id="authPassword" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label><div class="form-error" id="authError"></div><button class="primary" id="authSubmit" type="submit">Войти</button><button class="switch-auth" id="switchAuth" type="button">Нет аккаунта? Зарегистрироваться</button></form></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const state = { user: null, chatId: null, busy: false, imageMode: false, register: false, chats: [] };
const messagesEl = $('messages');
const chatArea = $('chatArea');
const promptEl = $('prompt');
const statusEl = $('status');

if (window.marked) {
  marked.setOptions({ gfm: true, breaks: true });
}
function renderMarkdown(text) {
  const source = String(text ?? '');
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(source), { USE_PROFILES: { html: false } });
  }
  const div = document.createElement('div');
  div.textContent = source;
  return div.innerHTML.replace(/\n/g, '<br>');
}
function showStatus(text = '', error = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('show', Boolean(text));
  statusEl.classList.toggle('error', Boolean(error));
}
function scrollToBottom() {
  requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
}
function addMessage(role, content, image = null, options = {}) {
  const row = document.createElement('div');
  row.className = `message ${role}`;
  if (role === 'assistant') {
    const mark = document.createElement('div');
    mark.className = 'message-mark';
    mark.textContent = '✳';
    row.appendChild(mark);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant' && !options.loading) bubble.innerHTML = renderMarkdown(content);
  else bubble.textContent = content || '';
  if (image) {
    const img = document.createElement('img');
    img.className = 'message-image';
    img.src = image;
    img.alt = 'Созданное изображение';
    img.loading = 'lazy';
    bubble.appendChild(img);
  }
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  return { row, bubble };
}
function resetView() {
  messagesEl.replaceChildren();
  $('welcome').classList.remove('hidden');
  state.chatId = null;
  showStatus('');
  scrollToBottom();
}
function setBusy(value) {
  state.busy = value;
  $('send').disabled = value;
  $('send').textContent = value ? '…' : '↑';
  promptEl.disabled = value;
  $('imageMode').disabled = value;
}
async function api(url, options = {}) {
  const response = await fetch(url, { credentials: 'same-origin', ...options, headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(options.headers || {}) } });
  let data;
  try { data = await response.json(); } catch { data = {}; }
  if (!response.ok) throw new Error(data.error || `Ошибка сервера (${response.status})`);
  return data;
}
async function loadMe() {
  try {
    const data = await api('/api/auth/me');
    state.user = data.user;
    updateProfile();
    if (state.user) await loadChats();
  } catch (err) { console.warn('Проверка аккаунта:', err.message); }
}
function updateProfile() {
  const loggedIn = Boolean(state.user);
  $('profile').classList.toggle('hidden', !loggedIn);
  $('authSide').classList.toggle('hidden', loggedIn);
  $('loginTop').classList.toggle('hidden', loggedIn);
  if (loggedIn) {
    const name = state.user.name || state.user.username || 'Пользователь';
    $('profileName').textContent = name;
    $('profileEmail').textContent = state.user.email || state.user.username || '';
    $('avatar').textContent = [...name][0]?.toUpperCase() || 'M';
  }
}
async function loadChats() {
  if (!state.user) return;
  try {
    const data = await api('/api/chats');
    state.chats = data.chats || [];
    const history = $('history');
    history.replaceChildren();
    if (!state.chats.length) {
      const empty = document.createElement('div');
      empty.className = 'small muted'; empty.textContent = 'Пока нет чатов'; history.appendChild(empty); return;
    }
    for (const chat of state.chats) {
      const button = document.createElement('button');
      button.className = 'history-item' + (Number(chat.id) === Number(state.chatId) ? ' active' : '');
      button.textContent = chat.title || 'Новый чат';
      button.title = chat.title || 'Новый чат';
      button.addEventListener('click', () => openChat(chat.id));
      history.appendChild(button);
    }
  } catch (err) { console.warn('Загрузка истории:', err.message); }
}
async function createChat() {
  if (!state.user) return null;
  const data = await api('/api/chats', { method: 'POST', body: JSON.stringify({}) });
  state.chatId = data.chat.id;
  await loadChats();
  return state.chatId;
}
async function openChat(id) {
  try {
    showStatus('Загружаю чат…');
    const data = await api(`/api/chats/${encodeURIComponent(id)}`);
    state.chatId = data.chat.id;
    messagesEl.replaceChildren();
    $('welcome').classList.add('hidden');
    for (const message of data.messages || []) addMessage(message.role, message.content, message.image);
    showStatus('');
    await loadChats();
    $('sidebar').classList.remove('open');
    scrollToBottom();
  } catch (err) { showStatus(err.message, true); }
}
async function saveMessage(role, content, image = null) {
  if (!state.user || !state.chatId) return;
  await api(`/api/chats/${encodeURIComponent(state.chatId)}/messages`, {
    method: 'POST', body: JSON.stringify({ role, content, image })
  });
}
async function sendMessage(text = promptEl.value) {
  text = String(text || '').trim();
  if (!text || state.busy) return;
  if (text.length > 30000) { showStatus('Сообщение превышает лимит 30 000 символов.', true); return; }
  const makeImage = state.imageMode;
  promptEl.value = '';
  promptEl.style.height = '31px';
  $('welcome').classList.add('hidden');
  showStatus('');
  addMessage('user', text);
  setBusy(true);
  let pending;
  try {
    if (state.user && !state.chatId) await createChat();
    if (state.user) await saveMessage('user', text);
    if (makeImage) {
      showStatus('Создаю изображение…');
      pending = addMessage('assistant', 'Создаю изображение…');
      const data = await api('/api/images', { method: 'POST', body: JSON.stringify({ prompt: text }) });
      pending.row.remove();
      addMessage('assistant', 'Готово! Вот твоё изображение:', data.image);
      if (state.user) await saveMessage('assistant', 'Готово! Вот твоё изображение:', data.image);
    } else {
      pending = addMessage('assistant', 'Думаю…');
      const history = [...messagesEl.querySelectorAll('.message')].slice(0, -2).map(row => ({
        role: row.classList.contains('user') ? 'user' : 'assistant',
        content: row.querySelector('.bubble')?.innerText || ''
      })).filter(item => item.content).slice(-10);
      const data = await api('/api/chat', { method: 'POST', body: JSON.stringify({ message: text, history }) });
      pending.row.remove();
      addMessage('assistant', data.reply || 'Не удалось получить ответ.');
      if (state.user) await saveMessage('assistant', data.reply || 'Не удалось получить ответ.');
    }
    if (state.user) await loadChats();
    showStatus('');
  } catch (err) {
    if (pending?.row?.isConnected) pending.row.remove();
    addMessage('assistant', `**Ошибка:** ${err.message}`);
    showStatus(err.message, true);
  } finally {
    setBusy(false);
    state.imageMode = false;
    $('imageMode').style.borderColor = '';
    promptEl.focus();
    scrollToBottom();
  }
}
function showAuth(register = false) {
  state.register = register;
  $('authTitle').textContent = register ? 'Создать аккаунт' : 'Войти в Maut AI';
  $('authSubtitle').textContent = register ? 'Создай аккаунт, чтобы сохранять историю чатов.' : 'Рады видеть тебя снова.';
  $('nameField').classList.toggle('hidden', !register);
  $('authName').required = register;
  $('authPassword').autocomplete = register ? 'new-password' : 'current-password';
  $('authSubmit').textContent = register ? 'Зарегистрироваться' : 'Войти';
  $('switchAuth').textContent = register ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
  $('authError').textContent = '';
  $('authModal').classList.add('open');
}
function closeAuth() { $('authModal').classList.remove('open'); }
$('authForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('authError').textContent = '';
  $('authSubmit').disabled = true;
  try {
    const body = { email: $('authEmail').value.trim(), password: $('authPassword').value };
    let endpoint = '/api/auth/login';
    if (state.register) {
      endpoint = '/api/auth/register';
      body.name = $('authName').value.trim();
    }
    const data = await api(endpoint, { method: 'POST', body: JSON.stringify(body) });
    state.user = data.user;
    updateProfile(); closeAuth(); resetView(); await loadChats();
    showStatus('Вход выполнен.'); setTimeout(() => showStatus(''), 2000);
  } catch (err) { $('authError').textContent = err.message; }
  finally { $('authSubmit').disabled = false; }
});
$('switchAuth').addEventListener('click', () => showAuth(!state.register));
$('closeModal').addEventListener('click', closeAuth);
$('authModal').addEventListener('click', e => { if (e.target === $('authModal')) closeAuth(); });
$('loginTop').addEventListener('click', () => showAuth(false));
$('authSide').addEventListener('click', () => showAuth(false));
$('logout').addEventListener('click', async () => {
  try { await api('/api/auth/logout', { method: 'POST', body: JSON.stringify({}) }); } catch (err) { showStatus(err.message, true); }
  state.user = null; state.chats = []; updateProfile(); resetView(); await loadChats();
});
$('newChat').addEventListener('click', () => { resetView(); loadChats(); $('sidebar').classList.remove('open'); promptEl.focus(); });
$('brandHome').addEventListener('click', e => { e.preventDefault(); resetView(); });
$('mobileMenu').addEventListener('click', () => $('sidebar').classList.toggle('open'));
$('imageMode').addEventListener('click', () => {
  state.imageMode = !state.imageMode;
  $('imageMode').style.borderColor = state.imageMode ? 'var(--green)' : '';
  promptEl.placeholder = state.imageMode ? 'Опиши изображение, которое нужно создать…' : 'Напиши сообщение Maut AI…';
  promptEl.focus();
});
$('composer').addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
promptEl.addEventListener('input', () => {
  promptEl.style.height = '31px';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + 'px';
});
document.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => {
  promptEl.value = button.dataset.prompt;
  promptEl.dispatchEvent(new Event('input'));
  sendMessage();
}));
loadMe();
</script>
</body>
</html>
